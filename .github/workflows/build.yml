name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates gcc meson ninja-build pkg-config python3 \
            libwayland-dev wayland-protocols libxkbcommon-dev libpixman-1-dev \
            libfcft-dev libtllist-dev libutf8proc-dev libfontconfig-dev \
            libpng-dev zlib1g-dev ncurses-bin weston libweston-14-dev fonts-dejavu-core
      - uses: actions/checkout@v4
      - name: Build
        run: |
          meson setup build -Ddocs=disabled -Dutmp-backend=none
          meson compile -C build
      - name: Unit tests
        run: meson test -C build --print-errorlogs
      - name: Real PTY and headless Wayland smoke test
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          export WAYLAND_DISPLAY=foot-kitty-test
          cc -shared -fPIC $(pkg-config --cflags libweston-14) \
            tests/weston-seat.c -o build/weston-seat.so $(pkg-config --libs libweston-14)
          weston --backend=headless --renderer=pixman --shell=kiosk-shell.so \
            --modules="$PWD/build/weston-seat.so" \
            --socket="$WAYLAND_DISPLAY" --idle-time=0 --log=weston.log &
          weston_pid=$!
          trap 'kill "$weston_pid"; cat weston.log' EXIT
          for attempt in $(seq 1 100); do
            test ! -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" || break
            kill -0 "$weston_pid" || exit 1
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          python3 tests/kitty-graphics-smoke.py build/foot
          FOOT_SMOKE_WORKERS=2 python3 tests/kitty-graphics-smoke.py build/foot
